name: chromium

on:
  push:
    branches: [chromium]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Chromium version
        run: |
          npm run build.chromium
          (cd addon-chromium && zip -qr ../sidebery-chromium.zip .)
      - name: Publish release
        run: |
          gh release delete chromium-latest --yes --cleanup-tag || true
          gh release create chromium-latest sidebery-chromium.zip \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Chromium build (latest)" \
            --notes "Automatic build of the chromium branch (${{ github.sha }}). Unzip sidebery-chromium.zip and load the folder via chrome://extensions -> Developer mode -> Load unpacked."
